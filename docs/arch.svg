<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" fill="none" stroke-width="1.5">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#0d1117" rx="12"/>
  <!-- Browser / CLI -->
  <rect x="40" y="80" width="160" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="120" y="115" text-anchor="middle" fill="#c9d1d9" font-size="16" font-family="system-ui">浏览器 / 管理后台</text>
  <text x="120" y="145" text-anchor="middle" fill="#8b949e" font-size="12">static/index.html</text>
  <text x="120" y="165" text-anchor="middle" fill="#8b949e" font-size="12">原生 JS / 暗色主题</text>
  <rect x="40" y="260" width="160" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="120" y="290" text-anchor="middle" fill="#c9d1d9" font-size="14">外部脚本 / API</text>
  <text x="120" y="310" text-anchor="middle" fill="#8b949e" font-size="12">Bearer Token</text>
  <!-- Core Server -->
  <rect x="300" y="60" width="300" height="380" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="450" y="95" text-anchor="middle" fill="#22c55e" font-size="18" font-weight="600">青豆面板 (Qingdou Panel)</text>
  <text x="450" y="115" text-anchor="middle" fill="#8b949e" font-size="12">Flask + waitress + APScheduler</text>
  <!-- Routes -->
  <rect x="330" y="140" width="110" height="80" rx="8" fill="#238636" fill-opacity="0.15" stroke="#2ea043"/>
  <text x="385" y="170" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="600">路由层</text>
  <text x="385" y="190" text-anchor="middle" fill="#8b949e" font-size="11">tasks / scripts / subs</text>
  <text x="385" y="205" text-anchor="middle" fill="#8b949e" font-size="11">deps / envs / notifs</text>
  <text x="385" y="220" text-anchor="middle" fill="#8b949e" font-size="11">system / yybgo / ai</text>
  <!-- Core -->
  <rect x="460" y="140" width="110" height="80" rx="8" fill="#1f6feb" fill-opacity="0.15" stroke="#58a6ff"/>
  <text x="515" y="170" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">核心层</text>
  <text x="515" y="190" text-anchor="middle" fill="#8b949e" font-size="11">executor 执行器</text>
  <text x="515" y="205" text-anchor="middle" fill="#8b949e" font-size="11">scheduler 调度器</text>
  <text x="515" y="220" text-anchor="middle" fill="#8b949e" font-size="11">subscription 订阅</text>
  <!-- Data -->
  <rect x="330" y="250" width="240" height="50" rx="8" fill="#8957e5" fill-opacity="0.15" stroke="#a371f7"/>
  <text x="450" y="280" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="600">SQLite (WAL) · data/qingdou.db</text>
  <!-- External services -->
  <rect x="340" y="330" width="105" height="50" rx="8" fill="#d29922" fill-opacity="0.15" stroke="#d29922"/>
  <text x="392" y="355" text-anchor="middle" fill="#d29922" font-size="12">yyb-go</text>
  <text x="392" y="370" text-anchor="middle" fill="#8b949e" font-size="10">微信扫码登录</text>
  <rect x="475" y="330" width="80" height="50" rx="8" fill="#d29922" fill-opacity="0.15" stroke="#d29922"/>
  <text x="515" y="355" text-anchor="middle" fill="#d29922" font-size="12">AI / LLM</text>
  <text x="515" y="370" text-anchor="middle" fill="#8b949e" font-size="10">OpenAI API</text>
  <!-- Right side data -->
  <rect x="680" y="80" width="180" height="340" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="770" y="115" text-anchor="middle" fill="#c9d1d9" font-size="16" font-weight="600">外部资源</text>
  <rect x="705" y="140" width="130" height="40" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="770" y="165" text-anchor="middle" fill="#8b949e" font-size="12">scripts/ 脚本库</text>
  <rect x="705" y="200" width="130" height="40" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="770" y="225" text-anchor="middle" fill="#8b949e" font-size="12">data/ 数据库与日志</text>
  <rect x="705" y="260" width="130" height="40" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="770" y="285" text-anchor="middle" fill="#8b949e" font-size="12">GitHub 仓库</text>
  <rect x="705" y="320" width="130" height="40" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="770" y="345" text-anchor="middle" fill="#8b949e" font-size="12">通知通道</text>
  <!-- Lines -->
  <line x1="200" y1="140" x2="300" y2="150" stroke="#22c55e" marker-end="url(#arr)"/>
  <line x1="200" y1="300" x2="300" y2="250" stroke="#22c55e" marker-end="url(#arr)"/>
  <line x1="600" y1="180" x2="680" y2="160" stroke="#58a6ff" marker-end="url(#arr)"/>
  <line x1="600" y1="220" x2="680" y2="220" stroke="#58a6ff" marker-end="url(#arr)"/>
  <line x1="600" y1="280" x2="680" y2="280" stroke="#58a6ff" marker-end="url(#arr)"/>
  <line x1="450" y1="440" x2="450" y2="470" stroke="#30363d"/>
  <text x="450" y="490" text-anchor="middle" fill="#8b949e" font-size="12">绿色可移动：整目录复制即用 · 相对路径 · 无硬编码</text>
</svg>